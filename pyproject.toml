[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute"
version = "0.1.0"
description = "A modular scientific computing toolkit built on plain Python and NumPy."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kalana Ratnayke", email = "a3226038@adelaide.edu.au" },
    { name = "Sanduni Galagoda", email = "a@adelaide.edu.au" },
    { name = "Danushi Jayasekara", email = "a@adelaide.edu.au" }
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["numcompute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
